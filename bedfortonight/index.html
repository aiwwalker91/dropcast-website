<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You've just prevented someone from sleeping rough tonight - Dropcast</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #F0EDE6;
      --red: #E05A3A;
      --red-dark: #C44828;
      --charcoal: #2A2A2A;
      --mid: #7A7570;
      --light: #DDD9D1;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Grain overlay — same as Dropcast homepage */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
      opacity: 0.4;
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 0 3rem;
    }

    header {
      padding: 2rem 0;
    }

    .logo {
      display: block;
      width: 160px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    /* ── Hero ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 5rem;
    }

    /* Eyebrow line */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.15s forwards;
    }

    .eyebrow-line {
      width: 36px;
      height: 2px;
      background: var(--red);
      flex-shrink: 0;
    }

    .eyebrow-text {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--red);
    }

    /* Giant headline */
    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--charcoal);
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    h1 .accent {
      color: var(--red);
    }

    /* Divider */
    .rule {
      width: 64px;
      height: 3px;
      background: var(--red);
      margin: 2.5rem 0;
      opacity: 0;
      animation: expand 0.8s ease 0.55s forwards;
      transform-origin: left;
    }

    @keyframes expand {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    /* Impact statement */
    .impact {
      max-width: 640px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.65s forwards;
    }

    .impact p {
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      line-height: 1.65;
      color: var(--mid);
      font-weight: 300;
    }

    .impact p strong {
      color: var(--charcoal);
      font-weight: 600;
    }

    /* Bed icon row */
    .bed-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 2.8rem;
      padding: 1.5rem 2rem;
      border: 1px solid var(--light);
      border-radius: 16px;
      background: rgba(255,255,255,0.45);
      max-width: 520px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s forwards;
    }

    .bed-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: var(--red);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bed-icon svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }

    .bed-label {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--charcoal);
    }

    .bed-label strong {
      display: block;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.15rem;
    }

    .bed-label span {
      color: var(--mid);
      font-weight: 300;
      font-size: 0.9rem;
    }

    /* ── Footer CTA band ── */
    .cta-band {
      border-top: 1px solid var(--light);
      padding: 3rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.7s ease 1s forwards;
    }

    .cta-band-text {
      flex: 1;
      min-width: 220px;
    }

    .cta-band-text p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--charcoal);
      line-height: 1.4;
    }

    .cta-band-text p span {
      color: var(--red);
    }

    .cta-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn-collab {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 0.95rem 2.2rem;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(224, 90, 58, 0.15);
      white-space: nowrap;
    }

    .btn-collab:hover {
      background: var(--red-dark);
      transform: translateY(-2px);
    }

    .cta-email {
      font-size: 0.88rem;
      color: var(--charcoal);
      text-decoration: none;
      border-bottom: 1px solid var(--light);
      white-space: nowrap;
      transition: border-color 0.2s;
    }

    .cta-email:hover {
      border-color: var(--charcoal);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .page { padding: 0 1.75rem; }
      .cta-band { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <img src="dropcast-logo.png" alt="Dropcast" class="logo"/>
  </header>

  <main>

    <div class="eyebrow">
      <span class="eyebrow-line"></span>
    </div>

    <h2>
      You've just prevented someone from sleeping on the street tonight.
    </h2>

    <div class="rule"></div>

    <div class="impact">
      <p>
        For every QR code scanned, <strong>we donate £10 to a local shelter.</strong><br>
      </p>
    </div>
  </main>

  <footer>
    <div class="cta-band">
      <div class="cta-band-text">
        <p>Want to create <span>meaningful moments</span> of your own?</p>
      </div>
      <div class="cta-actions">
        <a href="https://wa.me/351920287566" target="_blank" rel="noopener noreferrer" class="btn-collab">Get in touch</a>
        <a href="mailto:hello@dropcast.co" class="cta-email">hello@dropcast.co</a>
      </div>
    </div>
  </footer>

</div>
</body>
</html>
