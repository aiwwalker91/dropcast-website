<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dropcast | World Ocean Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --coral:        #E8461C;
      --coral-dark:   #C93A14;
      --cream:        #F5EDE3;
      --charcoal:     #1A1A1A;
      --warm-neutral: #A79184;
      --white:        #FFFFFF;
      --font-serif:   Georgia, serif;
      --font-sans:    'Manrope', system-ui, sans-serif;
    }

    /* ── Reset & Core Styles ── */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      background-color: var(--cream);
    }

    body {
      font-family: var(--font-sans);
      color: var(--charcoal);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Noise Texture Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E"),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.005' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.2'/%3E%3C/svg%3E");
      filter: contrast(120%) brightness(110%);
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: multiply;
      opacity: 0.5;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 3rem;
    }

    /* ── Header ── */
    header {
      padding: 2rem 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-link img.main-logo {
      width: 180px;
      max-width: 100%;
      display: block;
    }

    .nav-home {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--charcoal);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .nav-home:hover {
      color: var(--coral);
      border-bottom-color: var(--coral);
    }

    /* ── Hero Grid ── */
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 4rem;
      align-items: start;
      padding: 2rem 0 3rem;
      border-bottom: 1px solid #E0D5C8;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--coral);
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: block;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.1s forwards;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 3.8vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--charcoal);
      font-weight: 400;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.2s forwards;
    }

    h1 em {
      font-style: italic;
      font-weight: 700;
      color: var(--coral);
    }

    .intro {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--charcoal);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.3s forwards;
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--coral);
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: block;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.4s forwards;
    }

    /* Links List */
    .links-list {
      list-style: none;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.45s forwards;
    }

    .links-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid #E0D5C8;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .links-list li:first-child { 
      border-top: 1px solid #E0D5C8; 
    }

    .link-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .links-list a {
      color: var(--charcoal);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .links-list a:hover {
      color: var(--coral);
      border-bottom-color: var(--coral);
    }

    .link-desc {
      font-size: 0.85rem;
      color: var(--warm-neutral);
    }

    /* Inline Fact */
    .inline-fact {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid #E0D5C8;
    }

    .fact-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--coral);
      font-weight: 700;
      display: block;
      margin-bottom: 0.75rem;
    }

    .inline-fact h3 {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.25;
      color: var(--charcoal);
      margin-bottom: 0.75rem;
    }

    .inline-fact h3 em {
      font-style: italic;
      font-weight: 700;
      color: var(--coral);
    }

    .inline-fact p {
      font-size: 0.88rem;
      color: var(--warm-neutral);
      line-height: 1.65;
    }

    /* ── Slideshow (Right Column) ── */
    .hero-right {
      position: sticky;
      top: 2rem;
      opacity: 0;
      animation: fadeUp 0.6s ease-out 0.5s forwards;
      width: 100%;
    }

    .poster-label {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--warm-neutral);
      margin-bottom: 0.75rem;
      text-align: center;
      width: 100%;
      display: block;
    }

    .slideshow {
      width: 100%;
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: #EAE0D5;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 1rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warm-neutral);
      transition: background 0.3s, transform 0.2s;
      cursor: pointer;
    }

    .dot.active { 
      background: var(--coral); 
      transform: scale(1.2);
    }

    /* ── CTA Section ── */
    .cta-section {
      padding: 4rem 0;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 4rem;
      align-items: start;
    }

    .cta-left h2 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--charcoal);
      margin-bottom: 1.5rem;
    }

    .cta-left h2 em {
      font-style: italic;
      font-weight: 700;
      color: var(--coral);
    }

      color:
